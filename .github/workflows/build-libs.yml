name: Build ParPar Static Libraries

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'internal/parpar/vendor/**'
      - 'internal/parpar/bridge.*'
      - 'internal/parpar/csrc/**'
      - 'internal/parpar/Makefile'

permissions:
  contents: write

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal binary (amd64 + arm64)
        run: make -C internal/parpar darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libparpar_gf16_darwin
          path: internal/parpar/libparpar_gf16_darwin.a

  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -C internal/parpar linux/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libparpar_gf16_linux_amd64
          path: internal/parpar/libparpar_gf16_linux_amd64.a

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -C internal/parpar linux/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libparpar_gf16_linux_arm64
          path: internal/parpar/libparpar_gf16_linux_arm64.a

  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make

      # Pin the MinGW GCC toolchain to a fixed version so the prebuilt static
      # library stays ABI-compatible with downstream consumers. MSYS2 is a
      # rolling repo; GCC 16 dropped the emulated-TLS std::call_once symbols
      # (__emutls_v._ZSt11__once_call / __once_callable) that older libstdc++
      # emitted, which breaks linking of this lib in consumers. Consumers must
      # pin to the SAME version (see github.com/javi11/postie CI).
      - name: Pin MinGW GCC toolchain
        shell: msys2 {0}
        run: |
          GCC_VER=15.2.0-14
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-${GCC_VER}-any.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-${GCC_VER}-any.pkg.tar.zst
          gcc --version

      - name: Build
        shell: msys2 {0}
        run: make -C internal/parpar windows/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libparpar_gf16_windows_amd64
          path: internal/parpar/libparpar_gf16_windows_amd64.a

  commit:
    needs: [darwin, linux-amd64, linux-arm64, windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: internal/parpar
          merge-multiple: true

      - name: Commit updated libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/parpar/libparpar_gf16_*.a
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update pre-built ParPar static libraries"
            git push
          fi
