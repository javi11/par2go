name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            os: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - name: macos-arm64
            runner: macos-latest
            os: macos
          - name: windows-amd64
            runner: windows-latest
            os: windows

    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up MSYS2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: ''

      # Pin the MinGW GCC toolchain to match the version the prebuilt
      # libparpar_gf16_windows_amd64.a was built with. GCC 16 dropped the
      # emulated-TLS std::call_once symbols the archive references, so testing
      # the cgo bridge against a rolling GCC fails to link. Keep in sync with
      # build-libs.yml.
      - name: Pin MinGW GCC toolchain
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          GCC_VER=15.2.0-14
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-${GCC_VER}-any.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-${GCC_VER}-any.pkg.tar.zst
          gcc --version

      - name: Add MinGW to PATH
        if: matrix.os == 'windows'
        shell: pwsh
        run: echo "$env:RUNNER_TEMP\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ParPar picks its GF16 kernel from the runner CPU, and GitHub's
      # ubuntu-latest pool mixes Intel (AVX-512/GFNI) and AMD (AVX2) hosts.
      # Record which one we got so a native crash can be tied to a kernel.
      - name: Runner CPU info
        if: matrix.os == 'linux'
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 -o 'avx512[a-z_]*\|avx2\|gfni\|vbmi[0-9]*\|sve[0-9]*\|sha3' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          nproc

      - name: Runner CPU info (macOS)
        if: matrix.os == 'macos'
        run: sysctl -n machdep.cpu.brand_string hw.ncpu

      - name: Runner CPU info (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name

      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test -v ./...

      # Crashes inside the prebuilt SIMD kernels are intermittent; repeat the
      # encoder tests so a bad kernel shows up here rather than downstream.
      - name: Stress encoder
        if: matrix.os == 'linux'
        env:
          CGO_ENABLED: '1'
        run: go test -count=10 -run 'TestGfProc|TestCreate' ./...

      - name: Test with race detector
        if: matrix.os != 'windows'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
